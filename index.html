<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detection System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Lucide React icons as inline SVGs
        const AlertCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        );
        
        const CheckCircle = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        );
        
        const Shield = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
        );
        
        const TrendingUp = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        );
        
        const BarChart3 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M3 3v18h18"></path>
                <rect x="7" y="10" width="3" height="8"></rect>
                <rect x="14" y="6" width="3" height="12"></rect>
            </svg>
        );
        
        const FileText = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
        );
        
        const Loader2 = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
            </svg>
        );
        
        const WifiOff = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        );

        const FakeNewsDetector = () => {
            const [article, setArticle] = useState('');
            const [result, setResult] = useState(null);
            const [analyzing, setAnalyzing] = useState(false);
            const [modelStats, setModelStats] = useState(null);
            const [apiConnected, setApiConnected] = useState(false);

            const API_URL = 'http://localhost:5000/api';

            useEffect(() => {
                fetchModelStats();
            }, []);

            const fetchModelStats = async () => {
                try {
                    const response = await fetch(`${API_URL}/stats`);
                    if (response.ok) {
                        const data = await response.json();
                        setModelStats(data);
                        setApiConnected(true);
                    } else {
                        setApiConnected(false);
                    }
                } catch (error) {
                    console.error('Error fetching stats:', error);
                    setApiConnected(false);
                    setModelStats({
                        accuracy: 0,
                        precision: 0,
                        recall: 0,
                        f1_score: 0,
                        total_articles: 0,
                        training_date: 'Not Connected'
                    });
                }
            };

            const analyzeArticle = async () => {
                if (!article.trim()) {
                    alert('Please enter some text to analyze!');
                    return;
                }

                if (!apiConnected) {
                    alert('Backend API is not connected. Please start the Flask server first with: python app.py');
                    return;
                }

                setAnalyzing(true);
                setResult(null);

                try {
                    const response = await fetch(`${API_URL}/predict`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ text: article })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        setResult(data);
                    } else {
                        const error = await response.json();
                        alert(`Error: ${error.error}`);
                    }
                } catch (error) {
                    console.error('Error analyzing article:', error);
                    alert('Failed to connect to backend API. Please ensure Flask server is running on port 5000.');
                } finally {
                    setAnalyzing(false);
                }
            };

            const exampleArticles = [
                {
                    title: "Credible News",
                    text: "According to researchers at Harvard University, a new study published in Nature shows promising results in climate change mitigation efforts. The peer-reviewed research indicates that renewable energy adoption has increased significantly over the past decade."
                },
                {
                    title: "Suspicious Article",
                    text: "SHOCKING! You WON'T BELIEVE what this celebrity did! Doctors HATE this one simple trick! Click NOW before it's deleted! This SECRET will change your life FOREVER!!!"
                },
                {
                    title: "Official Report",
                    text: "The Federal Reserve announced today that interest rates will remain unchanged, according to the latest monetary policy statement released by officials. The decision was based on current economic indicators and inflation data."
                },
                {
                    title: "Political News",
                    text: "Government officials reported that economic indicators remain stable based on comprehensive data analysis from federal agencies. The report includes employment statistics and GDP growth figures from the last quarter."
                }
            ];

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900">
                    <div className="bg-slate-800/50 backdrop-blur-sm border-b border-slate-700">
                        <div className="max-w-7xl mx-auto px-4 py-6">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-3">
                                    <Shield className="w-10 h-10 text-blue-400" />
                                    <div>
                                        <h1 className="text-3xl font-bold text-white">Fake News Detection System</h1>
                                        <p className="text-slate-300 text-sm">AI-Powered ML Model with TF-IDF & Logistic Regression</p>
                                    </div>
                                </div>
                                <div className={`flex items-center gap-2 px-4 py-2 rounded-lg ${
                                    apiConnected ? 'bg-green-500/20 border border-green-500' : 'bg-red-500/20 border border-red-500'
                                }`}>
                                    {apiConnected ? (
                                        <>
                                            <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse" />
                                            <span className="text-green-400 text-sm font-medium">API Connected</span>
                                        </>
                                    ) : (
                                        <>
                                            <WifiOff className="w-4 h-4 text-red-400" />
                                            <span className="text-red-400 text-sm font-medium">API Offline</span>
                                        </>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-4 py-8">
                        {!apiConnected && (
                            <div className="mb-6 bg-yellow-500/10 border-2 border-yellow-500 rounded-lg p-4">
                                <div className="flex items-start gap-3">
                                    <AlertCircle className="w-6 h-6 text-yellow-400 flex-shrink-0 mt-0.5" />
                                    <div>
                                        <h3 className="text-yellow-400 font-bold mb-2">Backend API Not Connected</h3>
                                        <p className="text-slate-300 text-sm mb-2">
                                            Please start the Flask backend server to use predictions.
                                        </p>
                                        <div className="bg-slate-800 p-3 rounded text-sm">
                                            <p className="text-green-400 font-mono mb-1">Step 1: Install dependencies</p>
                                            <code className="text-white">pip install flask flask-cors pandas scikit-learn</code>
                                            <p className="text-green-400 font-mono mt-3 mb-1">Step 2: Run the Flask server</p>
                                            <code className="text-white">python app.py</code>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {modelStats && (
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                                <div className="bg-slate-800/50 backdrop-blur-sm rounded-lg p-4 border border-slate-700">
                                    <div className="flex items-center gap-2 mb-2">
                                        <TrendingUp className="w-5 h-5 text-green-400" />
                                        <span className="text-slate-300 text-sm">Accuracy</span>
                                    </div>
                                    <div className="text-3xl font-bold text-white">
                                        {apiConnected ? `${modelStats.accuracy.toFixed(1)}%` : 'N/A'}
                                    </div>
                                </div>
                                <div className="bg-slate-800/50 backdrop-blur-sm rounded-lg p-4 border border-slate-700">
                                    <div className="flex items-center gap-2 mb-2">
                                        <BarChart3 className="w-5 h-5 text-blue-400" />
                                        <span className="text-slate-300 text-sm">F1-Score</span>
                                    </div>
                                    <div className="text-3xl font-bold text-white">
                                        {apiConnected ? `${modelStats.f1_score.toFixed(1)}%` : 'N/A'}
                                    </div>
                                </div>
                                <div className="bg-slate-800/50 backdrop-blur-sm rounded-lg p-4 border border-slate-700">
                                    <div className="flex items-center gap-2 mb-2">
                                        <FileText className="w-5 h-5 text-purple-400" />
                                        <span className="text-slate-300 text-sm">Training Data</span>
                                    </div>
                                    <div className="text-3xl font-bold text-white">
                                        {apiConnected ? modelStats.total_articles.toLocaleString() : 'N/A'}
                                    </div>
                                </div>
                                <div className="bg-slate-800/50 backdrop-blur-sm rounded-lg p-4 border border-slate-700">
                                    <div className="flex items-center gap-2 mb-2">
                                        <CheckCircle className="w-5 h-5 text-emerald-400" />
                                        <span className="text-slate-300 text-sm">Model Status</span>
                                    </div>
                                    <div className={`text-xl font-bold ${apiConnected ? 'text-green-400' : 'text-red-400'}`}>
                                        {apiConnected ? 'Ready' : 'Offline'}
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                            <div className="lg:col-span-2">
                                <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 border border-slate-700">
                                    <h2 className="text-2xl font-bold text-white mb-4">Analyze Article</h2>
                                    
                                    <textarea
                                        value={article}
                                        onChange={(e) => setArticle(e.target.value)}
                                        placeholder="Paste your news article here..."
                                        className="w-full h-64 bg-slate-900/50 text-white border border-slate-600 rounded-lg p-4 focus:outline-none focus:ring-2 focus:ring-blue-500 placeholder-slate-500 resize-none"
                                    />

                                    <button
                                        onClick={analyzeArticle}
                                        disabled={analyzing || !apiConnected}
                                        className="mt-4 w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 text-white font-semibold py-3 px-6 rounded-lg transition-all duration-200 flex items-center justify-center gap-2"
                                    >
                                        {analyzing ? (
                                            <>
                                                <Loader2 className="w-5 h-5 animate-spin" />
                                                Analyzing with ML Model...
                                            </>
                                        ) : (
                                            <>
                                                <Shield className="w-5 h-5" />
                                                Analyze Article
                                            </>
                                        )}
                                    </button>

                                    {result && (
                                        <div className="mt-6 space-y-4">
                                            <div className={`rounded-lg p-6 border-2 ${
                                                result.prediction === 'FAKE NEWS' 
                                                    ? 'bg-red-500/10 border-red-500' 
                                                    : 'bg-green-500/10 border-green-500'
                                            }`}>
                                                <div className="flex items-center gap-3 mb-4">
                                                    {result.prediction === 'FAKE NEWS' ? (
                                                        <AlertCircle className="w-8 h-8 text-red-400" />
                                                    ) : (
                                                        <CheckCircle className="w-8 h-8 text-green-400" />
                                                    )}
                                                    <div>
                                                        <h3 className={`text-2xl font-bold ${
                                                            result.prediction === 'FAKE NEWS' ? 'text-red-400' : 'text-green-400'
                                                        }`}>
                                                            {result.prediction}
                                                        </h3>
                                                        <p className="text-slate-300 text-sm">
                                                            Confidence: {result.confidence.toFixed(1)}%
                                                        </p>
                                                    </div>
                                                </div>

                                                <div className="space-y-3">
                                                    <div>
                                                        <div className="flex justify-between text-sm mb-1">
                                                            <span className="text-green-400 font-medium">Real News Probability</span>
                                                            <span className="text-white">{result.real_probability.toFixed(1)}%</span>
                                                        </div>
                                                        <div className="w-full bg-slate-700 rounded-full h-3">
                                                            <div 
                                                                className="bg-green-500 h-3 rounded-full transition-all duration-500"
                                                                style={{ width: `${result.real_probability}%` }}
                                                            />
                                                        </div>
                                                    </div>

                                                    <div>
                                                        <div className="flex justify-between text-sm mb-1">
                                                            <span className="text-red-400 font-medium">Fake News Probability</span>
                                                            <span className="text-white">{result.fake_probability.toFixed(1)}%</span>
                                                        </div>
                                                        <div className="w-full bg-slate-700 rounded-full h-3">
                                                            <div 
                                                                className="bg-red-500 h-3 rounded-full transition-all duration-500"
                                                                style={{ width: `${result.fake_probability}%` }}
                                                            />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="mt-4 pt-4 border-t border-slate-600">
                                                    <p className="text-slate-400 text-xs">
                                                        Analyzed using TF-IDF vectorization with {modelStats?.total_articles.toLocaleString()} trained articles
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 border border-slate-700">
                                    <h3 className="text-xl font-bold text-white mb-4">Example Articles</h3>
                                    <div className="space-y-3">
                                        {exampleArticles.map((example, idx) => (
                                            <button
                                                key={idx}
                                                onClick={() => setArticle(example.text)}
                                                className="w-full text-left bg-slate-900/50 hover:bg-slate-900 p-3 rounded-lg border border-slate-600 hover:border-blue-500 transition-all"
                                            >
                                                <div className="text-blue-400 font-semibold text-sm mb-1">
                                                    {example.title}
                                                </div>
                                                <div className="text-slate-400 text-xs line-clamp-2">
                                                    {example.text}
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-slate-800/50 backdrop-blur-sm rounded-xl p-6 border border-slate-700">
                                    <h3 className="text-xl font-bold text-white mb-4">About</h3>
                                    <div className="text-slate-300 text-sm space-y-2">
                                        <p>
                                            This system uses a machine learning model trained on 44,000+ articles 
                                            to detect fake news with high accuracy.
                                        </p>
                                        <p className="pt-2 border-t border-slate-600">
                                            <strong className="text-white">Technology Stack:</strong>
                                        </p>
                                        <ul className="list-disc list-inside space-y-1 text-xs">
                                            <li>TF-IDF vectorization with bigrams</li>
                                            <li>Logistic Regression classifier</li>
                                            <li>Advanced text preprocessing</li>
                                            <li>Real-time prediction API</li>
                                            <li>Model persistence (no retraining)</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<FakeNewsDetector />);
    </script>
</body>
</html>
